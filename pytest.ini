[pytest]
testpaths = server/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
asyncio_mode = auto
env =
    ZHIPU_API_KEY=test_key_for_unit_tests
    DATABASE_PATH=/tmp/test_db.db
    STORAGE_ROOT=/tmp/test_storage
markers =
    asyncio: async test
    integration: integration test
    unit: unit test
